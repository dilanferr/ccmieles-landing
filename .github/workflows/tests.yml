name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

  # Los E2E (Playwright) requieren usuarios de prueba y una app corriendo, por
  # lo que no se ejecutan aquí por defecto. Para habilitarlos, provee los secrets
  # E2E_* y descomenta este job (ver e2e/README.md).
